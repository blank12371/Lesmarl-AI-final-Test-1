services:
  - type: web
    name: lesmarl-ai
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --worker-class gthread --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DEFAULT_MODEL
        value: meta-llama/llama-3.1-8b-instruct:free
      - key: FALLBACK_MODELS
        value: google/gemma-3-4b-it:free,mistralai/mistral-7b-instruct:free
      - key: SITE_URL
        value: https://your-app.onrender.com
